name: Tracking security smoke checks

on:
  pull_request:
    paths:
      - "customer-tracking.html"
      - "premium-ui.css"
      - "staff-control-tower-v2.css"
      - "staff-login-v3.css"
      - "staff-portal.css"
      - "staff-portal.js"
      - "tracking-link-admin.html"
      - "index.html"
      - "app.js"
      - "supabase/functions/customer-tracking/**"
      - "supabase/functions/customer-tracking-admin/**"
      - "supabase/functions/operations-data/**"
      - "supabase/migrations/**"
      - "tests/security-smoke-check.mjs"
      - ".github/workflows/tracking-security-checks.yml"
  push:
    branches:
      - main
      - security/staff-auth-and-token-management

permissions:
  contents: read

jobs:
  static-security-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run security smoke checks
        run: node tests/security-smoke-check.mjs
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check customer lookup function
        run: deno check supabase/functions/customer-tracking/index.ts
      - name: Type-check tracking admin function
        run: deno check supabase/functions/customer-tracking-admin/index.ts
      - name: Type-check operations data function
        run: deno check supabase/functions/operations-data/index.ts
