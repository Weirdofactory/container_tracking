name: Tracking security smoke checks

on:
  pull_request:
    paths:
      - "customer-tracking.html"
      - "tracking-link-admin.html"
      - "index.html"
      - "app.js"
      - "supabase/functions/customer-tracking/**"
      - "supabase/functions/customer-tracking-admin/**"
      - "supabase/functions/operations-data/**"
      - "supabase/migrations/**"
      - "tests/security-smoke-check.mjs"
      - "tests/postgres-security-migration-checks.sql"
      - "tests/postgres-inactive-staff-audit-rejection.sql"
      - "tests/fixtures/**"
      - ".github/workflows/tracking-security-checks.yml"
  push:
    branches:
      - main
      - security/staff-auth-and-token-management

permissions:
  contents: read

jobs:
  static-security-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tracking_security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tracking_security_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: tracking_security_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run security smoke checks
        run: node tests/security-smoke-check.mjs
      - name: Set up PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Build disposable legacy-policy fixture
        run: psql -v ON_ERROR_STOP=1 -f tests/fixtures/security-lockdown-prestate.sql
      - name: Apply lockdown migration to disposable PostgreSQL
        run: psql --single-transaction -v ON_ERROR_STOP=1 -f supabase/migrations/202610180001_lock_down_legacy_public_access.sql
      - name: Verify migrated table/function grants and active audit insertion
        run: psql -v ON_ERROR_STOP=1 -f tests/postgres-security-migration-checks.sql
      - name: Verify inactive staff audit insert is rejected
        shell: bash
        run: |
          output="$(psql -v ON_ERROR_STOP=1 -f tests/postgres-inactive-staff-audit-rejection.sql 2>&1)" && {
            echo "ERROR: inactive staff unexpectedly inserted an audit row" >&2
            exit 1
          }
          echo "$output"
          if ! grep -qi "row-level security policy" <<<"$output"; then
            echo "ERROR: inactive insert failed for a reason other than the intended RLS policy" >&2
            exit 1
          fi
          echo "Verified: inactive staff insert was rejected by RLS."
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check customer lookup function
        run: deno check supabase/functions/customer-tracking/index.ts
      - name: Type-check tracking admin function
        run: deno check supabase/functions/customer-tracking-admin/index.ts
      - name: Type-check operations data function
        run: deno check supabase/functions/operations-data/index.ts
